name: Keep Spenrol Backend Alive

on:
  schedule:
    - cron: '*/14 * * * *'  # every 14 minutes (safer than 14 for 15-minute limits)
  workflow_dispatch:         # allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Spenrol API
        run: |
          # Use -o /dev/null to discard the body and -w to grab only the status code
          # Use -L to follow any redirects (like HTTP to HTTPS)
          # Increase max-time to 120s to allow for cold starts on free tier hosting
          # Append || echo "000" to prevent set -e from failing the job if curl times out
          status=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 120 "${{ secrets.BACKEND_URL }}" || echo "000")
          echo "HTTP Status: $status"
          
          if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
            echo "Backend is awake ✓"
          else
            echo "Backend returned unexpected status: $status (or curl failed/timed out)"
            exit 1
          fi